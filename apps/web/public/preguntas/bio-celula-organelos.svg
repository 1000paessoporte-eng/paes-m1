<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400" role="img">
  <title>Esquema de una célula eucarionte animal con cinco estructuras numeradas</title>
  <g fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round">
    <!-- membrana plasmática y citoplasma -->
    <ellipse cx="270" cy="200" rx="215" ry="155" fill="#eef2f7"/>
    <ellipse cx="270" cy="200" rx="207" ry="147" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- núcleo -->
    <circle cx="248" cy="176" r="66" fill="#dbe4f0"/>
    <circle cx="248" cy="176" r="58" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <circle cx="262" cy="164" r="19" fill="#b7c6dc" stroke="#475569" stroke-width="1.5"/>

    <!-- mitocondria -->
    <g>
      <ellipse cx="392" cy="262" rx="58" ry="30" fill="#f6ddc8" stroke="#9a3412"/>
      <path d="M348 262c12-16 18 16 30 0s18 16 30 0 18 16 28 0" stroke="#9a3412" stroke-width="1.6"/>
    </g>

    <!-- aparato de Golgi -->
    <g stroke="#4d7c0f" stroke-width="2.4" stroke-linecap="round">
      <path d="M118 250c26-16 62-16 88 0" fill="#e2f0cf"/>
      <path d="M124 264c24-15 56-15 78 0" fill="#e2f0cf"/>
      <path d="M130 278c21-13 48-13 67 0" fill="#e2f0cf"/>
      <circle cx="108" cy="238" r="6" fill="#e2f0cf"/>
      <circle cx="212" cy="292" r="5" fill="#e2f0cf"/>
    </g>

    <!-- retículo endoplásmico rugoso -->
    <g stroke="#7e22ce" stroke-width="2.2" stroke-linecap="round">
      <path d="M96 132c26-30 62-34 92-22" fill="none"/>
      <path d="M92 152c28-32 66-36 98-24" fill="none"/>
      <g fill="#7e22ce" stroke="none">
        <circle cx="100" cy="124" r="3.2"/><circle cx="124" cy="108" r="3.2"/>
        <circle cx="152" cy="103" r="3.2"/><circle cx="178" cy="107" r="3.2"/>
        <circle cx="94" cy="146" r="3.2"/><circle cx="120" cy="128" r="3.2"/>
        <circle cx="150" cy="124" r="3.2"/><circle cx="178" cy="129" r="3.2"/>
      </g>
    </g>

    <!-- lisosomas, sin numerar -->
    <circle cx="330" cy="118" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <circle cx="368" cy="150" r="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

    <!-- líneas guía -->
    <g stroke="#1f2937" stroke-width="1.4">
      <path d="M470 96 L455 130"/>
      <path d="M300 40 L276 114"/>
      <path d="M496 300 L440 275"/>
      <path d="M60 330 L152 274"/>
      <path d="M92 66 L128 112"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">
    <circle cx="478" cy="84" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="478" y="91">1</text>
    <circle cx="304" cy="28" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="304" y="35">2</text>
    <circle cx="508" cy="310" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="508" y="317">3</text>
    <circle cx="48" cy="338" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="48" y="345">4</text>
    <circle cx="80" cy="56" r="15" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="80" y="63">5</text>
  </g>
</svg>
