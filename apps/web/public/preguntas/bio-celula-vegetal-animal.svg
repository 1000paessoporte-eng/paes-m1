<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img">
  <title>Una célula vegetal y una célula animal comparadas, con cuatro estructuras numeradas</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- CÉLULA A: vegetal -->
    <text x="160" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Célula A</text>
    <rect x="42" y="52" width="236" height="212" rx="10" fill="#e8f2e2" stroke="#166534" stroke-width="5"/>
    <rect x="52" y="62" width="216" height="192" rx="6" fill="#f2f8ee" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- vacuola -->
    <rect x="86" y="96" width="140" height="112" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
    <!-- núcleo -->
    <circle cx="92" cy="222" r="26" fill="#dbe4f0" stroke="#1f2937" stroke-width="2.4"/>
    <circle cx="92" cy="222" r="9" fill="#b7c6dc" stroke="#475569" stroke-width="1.4"/>
    <!-- cloroplastos -->
    <g fill="#bbf7d0" stroke="#15803d" stroke-width="2">
      <ellipse cx="228" cy="80" rx="19" ry="11"/>
      <ellipse cx="238" cy="228" rx="19" ry="11"/>
      <ellipse cx="168" cy="238" rx="19" ry="11"/>
    </g>

    <!-- CÉLULA B: animal -->
    <text x="482" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Célula B</text>
    <ellipse cx="482" cy="158" rx="128" ry="106" fill="#f2f4f8" stroke="#1f2937" stroke-width="2.6"/>
    <circle cx="470" cy="146" r="38" fill="#dbe4f0" stroke="#1f2937" stroke-width="2.4"/>
    <circle cx="470" cy="146" r="13" fill="#b7c6dc" stroke="#475569" stroke-width="1.4"/>
    <ellipse cx="546" cy="212" rx="30" ry="16" fill="#f6ddc8" stroke="#9a3412" stroke-width="2"/>
    <path d="M522 212c7-9 10 9 17 0s10 9 17 0" fill="none" stroke="#9a3412" stroke-width="1.4"/>
    <ellipse cx="410" cy="224" rx="26" ry="14" fill="#f6ddc8" stroke="#9a3412" stroke-width="2"/>
    <path d="M390 224c6-8 9 8 15 0s9 8 15 0" fill="none" stroke="#9a3412" stroke-width="1.4"/>

    <!-- números -->
    <g font-size="18" font-weight="700" fill="#111827" text-anchor="middle">
      <g stroke="#1f2937" stroke-width="1.4" fill="none">
        <path d="M22 88 L44 60"/>
        <path d="M156 152 L156 128"/>
        <path d="M266 300 L238 246"/>
        <path d="M596 268 L560 224"/>
      </g>
      <circle cx="18" cy="76" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="18" y="83">1</text>
      <circle cx="156" cy="166" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="156" y="173">2</text>
      <circle cx="274" cy="312" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="274" y="319">3</text>
      <circle cx="606" cy="280" r="14" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="606" y="287">4</text>
    </g>
  </g>
</svg>
