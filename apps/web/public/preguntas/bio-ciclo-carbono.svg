<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
  <title>Ciclo del carbono con cuatro procesos rotulados con las letras W, X, Y y Z</title>
  <defs>
    <marker id="fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g stroke="#475569" stroke-width="2.8" fill="none" marker-end="url(#fc)">
      <path d="M290 90 L226 176"/>
      <path d="M306 212 L462 212"/>
      <path d="M544 178 L444 90"/>
      <path d="M162 318 C 34 262, 44 96, 268 60"/>
    </g>
    <g font-size="21" font-weight="700" fill="#111827">
      <text x="236" y="128">W</text>
      <text x="374" y="200">X</text>
      <text x="488" y="128">Y</text>
      <text x="30" y="200">Z</text>
    </g>

    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="262" y="24" width="182" height="58" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.6"/>
      <text x="353" y="48" font-size="15" fill="#111827">Dióxido de carbono</text>
      <text x="353" y="70" font-size="15" fill="#111827">en la atmósfera</text>

      <rect x="150" y="186" width="156" height="52" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2.6"/>
      <text x="228" y="218" fill="#111827">Plantas</text>

      <rect x="462" y="186" width="156" height="52" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2.6"/>
      <text x="540" y="218" fill="#111827">Animales</text>

      <rect x="118" y="318" width="196" height="58" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="2.6"/>
      <text x="216" y="343" fill="#111827">Combustibles</text>
      <text x="216" y="364" fill="#111827">fósiles</text>
    </g>
  </g>
</svg>
