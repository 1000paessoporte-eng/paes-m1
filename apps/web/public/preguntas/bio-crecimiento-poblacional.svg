<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img">
  <title>Gráfico del tamaño de una población de conejos a lo largo de doce años, con capacidad de carga</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- cuadrícula -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="80" y1="80" x2="560" y2="80"/>
      <line x1="80" y1="154" x2="560" y2="154"/>
      <line x1="80" y1="228" x2="560" y2="228"/>
      <line x1="80" y1="302" x2="560" y2="302"/>
    </g>

    <!-- capacidad de carga -->
    <line x1="80" y1="117" x2="560" y2="117" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="88" y="108" font-size="14" font-weight="600" fill="#b91c1c">K = 1.200 (capacidad de carga)</text>

    <!-- curva -->
    <path d="M80.0 336.7 L90.0 336.1 L100.0 335.4 L110.0 334.5 L120.0 333.5 L130.0 332.3 L140.0 330.8 L150.0 329.2 L160.0 327.2 L170.0 324.9 L180.0 322.3 L190.0 319.2 L200.0 315.7 L210.0 311.6 L220.0 307.0 L230.0 301.8 L240.0 295.9 L250.0 289.4 L260.0 282.2 L270.0 274.4 L280.0 266.1 L290.0 257.2 L300.0 247.9 L310.0 238.3 L320.0 228.6 L330.0 218.8 L340.0 209.3 L350.0 200.0 L360.0 191.1 L370.0 182.7 L380.0 174.9 L390.0 167.7 L400.0 161.2 L410.0 155.4 L420.0 150.1 L430.0 145.5 L440.0 141.5 L450.0 137.9 L460.0 134.8 L470.0 132.2 L480.0 129.9 L490.0 128.0 L500.0 126.3 L510.0 124.9 L520.0 123.7 L530.0 122.7 L540.0 121.8 L550.0 121.1 L560.0 120.4" fill="none" stroke="#1d4ed8" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- ejes -->
    <g stroke="#1f2937" stroke-width="2.4" fill="none">
      <path d="M80 40 L80 340 L560 340"/>
    </g>

    <!-- marcas del eje Y -->
    <g font-size="13" fill="#4b5563" text-anchor="end">
      <text x="70" y="345">0</text>
      <text x="70" y="307">200</text>
      <text x="70" y="233">600</text>
      <text x="70" y="159">1.000</text>
      <text x="70" y="85">1.400</text>
    </g>
    <!-- marcas del eje X -->
    <g font-size="13" fill="#4b5563" text-anchor="middle">
      <text x="80" y="362">0</text>
      <text x="200" y="362">3</text>
      <text x="320" y="362">6</text>
      <text x="440" y="362">9</text>
      <text x="560" y="362">12</text>
    </g>

    <!-- puntos marcados sobre la curva -->
    <g>
      <circle cx="140" cy="330.8" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
      <text x="140" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">P</text>
      <circle cx="320" cy="228.6" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
      <text x="304" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Q</text>
      <circle cx="440" cy="141.5" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
      <text x="424" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">R</text>
      <circle cx="540" cy="121.8" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
      <text x="530" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">S</text>
    </g>

    <!-- nombres de los ejes -->
    <text x="320" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Tiempo (años)</text>
    <text x="24" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#111827"
          transform="rotate(-90 24 190)">Número de conejos</text>
  </g>
</svg>
