<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <title>Pirámide de energía de cuatro niveles tróficos, con el último nivel sin dato</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <path d="M211.0 42 L389.0 42 L409.0 104 L191.0 104 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="300" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Consumidores terciarios</text>
    <text x="300" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">? kcal</text>
    <path d="M169.0 114 L431.0 114 L451.0 176 L149.0 176 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="300" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Consumidores secundarios</text>
    <text x="300" y="163" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">100 kcal</text>
    <path d="M127.0 186 L473.0 186 L493.0 248 L107.0 248 Z" fill="#fef9c3" stroke="#a16207" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="300" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Consumidores primarios</text>
    <text x="300" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#a16207">1.000 kcal</text>
    <path d="M85.0 258 L515.0 258 L535.0 320 L65.0 320 Z" fill="#dcfce7" stroke="#15803d" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="300" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Productores</text>
    <text x="300" y="307" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">10.000 kcal</text>
    <text x="300" y="348" text-anchor="middle" font-size="14" fill="#4b5563">
      Energía disponible en cada nivel trófico de un mismo ecosistema.
    </text>
  </g>
</svg>
