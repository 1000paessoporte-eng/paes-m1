<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" role="img">
  <title>Gráfico de la velocidad de entrada de dos sustancias a la célula según su concentración exterior</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="80" y1="90" x2="540" y2="90"/>
      <line x1="80" y1="160" x2="540" y2="160"/>
      <line x1="80" y1="230" x2="540" y2="230"/>
      <line x1="80" y1="300" x2="540" y2="300"/>
    </g>

    <!-- sustancia X: recta -->
    <path d="M80 340 L520 74" fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round"/>
    <text x="520" y="64" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">X</text>

    <!-- sustancia Y: satura -->
    <path d="M80 340 C 150 250, 210 160, 300 140 C 370 126, 450 124, 520 122"
          fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round"/>
    <text x="536" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">Y</text>

    <g stroke="#1f2937" stroke-width="2.4" fill="none">
      <path d="M80 40 L80 340 L540 340"/>
    </g>

    <text x="310" y="376" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">
      Concentración de la sustancia fuera de la célula
    </text>
    <text x="26" y="190" text-anchor="middle" font-size="15" font-weight="600" fill="#111827"
          transform="rotate(-90 26 190)">Velocidad de entrada</text>
  </g>
</svg>
