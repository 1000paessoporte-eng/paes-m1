<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" width="600" height="392" role="img">
  <title>Barras de energía cinética y potencial del mismo cuerpo en tres instantes, con un valor sin completar</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <line x1="40" y1="300" x2="560" y2="300" stroke="#1f2937" stroke-width="2.4"/>
    <text x="26" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" transform="rotate(-90 26 180)">Energía (J)</text>
    <text x="135" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Instante 1</text>
    <rect x="70" y="300" width="54" height="0" rx="4" fill="#1d4ed8" fill-opacity="0.25" stroke="#1d4ed8" stroke-width="2.4"/>
    <text x="97" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">0</text>
    <rect x="140" y="80" width="54" height="220" rx="4" fill="#15803d" fill-opacity="0.25" stroke="#15803d" stroke-width="2.4"/>
    <text x="167" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">100</text>
    <text x="305" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Instante 2</text>
    <rect x="240" y="168" width="54" height="132" rx="4" fill="#1d4ed8" fill-opacity="0.25" stroke="#1d4ed8" stroke-width="2.4"/>
    <text x="267" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">60</text>
    <rect x="310" y="212" width="54" height="88" rx="4" fill="#15803d" fill-opacity="0.25" stroke="#15803d" stroke-width="2.4"/>
    <text x="337" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">40</text>
    <text x="475" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Instante 3</text>
    <rect x="410" y="212" width="54" height="88" rx="4" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="437" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">?</text>
    <rect x="480" y="300" width="54" height="0" rx="4" fill="#15803d" fill-opacity="0.25" stroke="#15803d" stroke-width="2.4"/>
    <text x="507" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">0</text>
    <g font-size="14"><rect x="170" y="356" width="16" height="16" rx="3" fill="#1d4ed8" fill-opacity="0.25" stroke="#1d4ed8" stroke-width="2"/><text x="194" y="369" fill="#111827">cinética</text><rect x="296" y="356" width="16" height="16" rx="3" fill="#15803d" fill-opacity="0.25" stroke="#15803d" stroke-width="2"/><text x="320" y="369" fill="#111827">potencial</text></g>
  </g>
</svg>
