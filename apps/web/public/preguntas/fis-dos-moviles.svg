<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" role="img">
  <title>Gráfico de posición contra tiempo de dos móviles A y B cuyas rectas se cruzan</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="80" y1="270" x2="540" y2="270"/>
      <line x1="80" y1="220" x2="540" y2="220"/>
      <line x1="80" y1="170" x2="540" y2="170"/>
      <line x1="80" y1="120" x2="540" y2="120"/>
      <line x1="80" y1="70" x2="540" y2="70"/>
    </g>
    <path d="M80 50 L80 320 L540 320" fill="none" stroke="#1f2937" stroke-width="2.4"/>
    <text x="80" y="342" text-anchor="middle" font-size="13" fill="#4b5563">0</text>
    <text x="172" y="342" text-anchor="middle" font-size="13" fill="#4b5563">2</text>
    <text x="264" y="342" text-anchor="middle" font-size="13" fill="#4b5563">4</text>
    <text x="356" y="342" text-anchor="middle" font-size="13" fill="#4b5563">6</text>
    <text x="448" y="342" text-anchor="middle" font-size="13" fill="#4b5563">8</text>
    <text x="540" y="342" text-anchor="middle" font-size="13" fill="#4b5563">10</text>
    <text x="70" y="325" text-anchor="end" font-size="13" fill="#4b5563">0</text>
    <text x="70" y="275" text-anchor="end" font-size="13" fill="#4b5563">20</text>
    <text x="70" y="225" text-anchor="end" font-size="13" fill="#4b5563">40</text>
    <text x="70" y="175" text-anchor="end" font-size="13" fill="#4b5563">60</text>
    <text x="70" y="125" text-anchor="end" font-size="13" fill="#4b5563">80</text>
    <text x="70" y="75" text-anchor="end" font-size="13" fill="#4b5563">100</text>
    <text x="310.0" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Tiempo (s)</text>
    <text x="22" y="185.0" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" transform="rotate(-90 22 185.0)">Posición (m)</text>
    <path d="M80 320 L540 70" fill="none" stroke="#1d4ed8" stroke-width="3.4"/>
    <path d="M80 220 L540 95" fill="none" stroke="#b91c1c" stroke-width="3.4" stroke-dasharray="10 6"/>
    <g font-size="16" font-weight="700"><text x="556" y="76" fill="#1d4ed8">A</text><text x="556" y="101" fill="#b91c1c">B</text></g>
  </g>
</svg>
