<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img">
  <title>Cinco posiciones sucesivas de un carrito fotografiadas cada un segundo, cada vez más separadas</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <line x1="40" y1="120" x2="40" y2="176" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="40" cy="100" r="17" fill="#b91c1c" fill-opacity="0.85" stroke="#b91c1c" stroke-width="2"/>
    <text x="40" y="200" text-anchor="middle" font-size="14" fill="#4b5563">0</text>
    <line x1="100" y1="120" x2="100" y2="176" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="100" cy="100" r="17" fill="#b91c1c" fill-opacity="0.85" stroke="#b91c1c" stroke-width="2"/>
    <text x="100" y="200" text-anchor="middle" font-size="14" fill="#4b5563">1</text>
    <line x1="190" y1="120" x2="190" y2="176" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="190" cy="100" r="17" fill="#b91c1c" fill-opacity="0.85" stroke="#b91c1c" stroke-width="2"/>
    <text x="190" y="200" text-anchor="middle" font-size="14" fill="#4b5563">2</text>
    <line x1="310" y1="120" x2="310" y2="176" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="310" cy="100" r="17" fill="#b91c1c" fill-opacity="0.85" stroke="#b91c1c" stroke-width="2"/>
    <text x="310" y="200" text-anchor="middle" font-size="14" fill="#4b5563">3</text>
    <line x1="460" y1="120" x2="460" y2="176" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle cx="460" cy="100" r="17" fill="#b91c1c" fill-opacity="0.85" stroke="#b91c1c" stroke-width="2"/>
    <text x="460" y="200" text-anchor="middle" font-size="14" fill="#4b5563">4</text>
    <line x1="20" y1="176" x2="560" y2="176" stroke="#1f2937" stroke-width="2.6"/>
    <text x="290" y="232" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Cada foto se tomó exactamente 1 segundo después de la anterior.</text>
    <text x="290" y="42" text-anchor="middle" font-size="15" fill="#4b5563">Posiciones sucesivas de un carrito, fotografiadas a intervalos iguales</text>
  </g>
</svg>
