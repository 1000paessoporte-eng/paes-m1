<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 398" width="600" height="398" role="img">
  <title>Pista con dos cerros y cuatro puntos marcados a distinta altura</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <path d="M40 340 L150 90 L300 300 L430 170 L530 340 Z" fill="#f1f5f9"/>
    <path d="M40 340 L150 90 L300 300 L430 170 L530 340" fill="none" stroke="#1f2937" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="24" y1="340" x2="576" y2="340" stroke="#4b5563" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="150" cy="90" r="9" fill="#fff" stroke="#b91c1c" stroke-width="3.4"/>
    <text x="145" y="66" font-size="18" font-weight="700" fill="#b91c1c">W</text>
    <circle cx="300" cy="300" r="9" fill="#fff" stroke="#b91c1c" stroke-width="3.4"/>
    <text x="295" y="280" font-size="18" font-weight="700" fill="#b91c1c">X</text>
    <circle cx="430" cy="170" r="9" fill="#fff" stroke="#b91c1c" stroke-width="3.4"/>
    <text x="425" y="150" font-size="18" font-weight="700" fill="#b91c1c">Y</text>
    <circle cx="530" cy="340" r="9" fill="#fff" stroke="#b91c1c" stroke-width="3.4"/>
    <text x="525" y="318" font-size="18" font-weight="700" fill="#b91c1c">Z</text>
    <text x="300" y="382" text-anchor="middle" font-size="14" fill="#4b5563">Un carro se suelta desde W y recorre la pista. No hay roce.</text>
  </g>
</svg>
