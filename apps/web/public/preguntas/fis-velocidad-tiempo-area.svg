<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img">
  <title>Gráfico de velocidad contra tiempo: sube, se mantiene y baja</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="80" y1="240" x2="540" y2="240"/>
      <line x1="80" y1="180" x2="540" y2="180"/>
      <line x1="80" y1="120" x2="540" y2="120"/>
      <line x1="80" y1="60" x2="540" y2="60"/>
    </g>
    <path d="M80 50 L80 300 L540 300" fill="none" stroke="#1f2937" stroke-width="2.4"/>
    <text x="80" y="322" text-anchor="middle" font-size="13" fill="#4b5563">0</text>
    <text x="195" y="322" text-anchor="middle" font-size="13" fill="#4b5563">2</text>
    <text x="310" y="322" text-anchor="middle" font-size="13" fill="#4b5563">4</text>
    <text x="425" y="322" text-anchor="middle" font-size="13" fill="#4b5563">6</text>
    <text x="540" y="322" text-anchor="middle" font-size="13" fill="#4b5563">8</text>
    <text x="70" y="305" text-anchor="end" font-size="13" fill="#4b5563">0</text>
    <text x="70" y="245" text-anchor="end" font-size="13" fill="#4b5563">5</text>
    <text x="70" y="185" text-anchor="end" font-size="13" fill="#4b5563">10</text>
    <text x="70" y="125" text-anchor="end" font-size="13" fill="#4b5563">15</text>
    <text x="70" y="65" text-anchor="end" font-size="13" fill="#4b5563">20</text>
    <text x="310.0" y="348" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Tiempo (s)</text>
    <text x="22" y="175.0" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" transform="rotate(-90 22 175.0)">Velocidad (m/s)</text>
    <path d="M80 300 L195 180 L425 180 L540 300 Z" fill="#1d4ed8" fill-opacity="0.14"/>
    <path d="M80 300 L195 180 L425 180 L540 300" fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linejoin="round"/>
  </g>
</svg>
