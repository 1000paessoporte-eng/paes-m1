<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img">
  <title>Dos representaciones del mismo país ficticio de Duna. A la izquierda, el mapa por superficie: las regiones M, N, O y P se dibujan según el territorio, y P ocupa más de la mitad del país mientras O es la más angosta. A la derecha, el cartograma por población: O pasa a ser la mayor y P queda reducida a una franja delgada. Una nota indica que en el cartograma el tamaño representa la población y no el territorio.</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Duna: la misma región, dos representaciones</text>
    <text x="140" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Mapa por superficie</text>
    <rect x="80" y="62" width="120" height="61" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">M</text>
    <rect x="80" y="123" width="120" height="50" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">N</text>
    <rect x="80" y="173" width="120" height="33" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">O</text>
    <rect x="80" y="206" width="120" height="155" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="289" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">P</text>
    <text x="420" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cartograma por población</text>
    <rect x="360" y="62" width="120" height="63" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="99" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">M</text>
    <rect x="360" y="125" width="120" height="84" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">N</text>
    <rect x="360" y="209" width="120" height="126" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">O</text>
    <rect x="360" y="335" width="120" height="25" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="353" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">P</text>
    <path d="M232 210 L328 210" stroke="#111827" stroke-width="1.8"/>
    <path d="M328 210 L318 205 M328 210 L318 215" stroke="#111827" stroke-width="1.8"/>
    <text x="280" y="382" text-anchor="middle" font-size="12" fill="#4b5563">En el cartograma el tamaño representa la población, no el territorio.</text>
    <text x="280" y="398" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
