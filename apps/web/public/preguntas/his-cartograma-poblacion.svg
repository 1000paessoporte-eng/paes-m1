<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img">
  <title>Dos representaciones del mismo país ficticio de Ventura, una al lado de la otra. A la izquierda, el mapa por superficie: las cinco regiones A, B, C, D y E se dibujan según el territorio que ocupan y E es con diferencia la más extensa, mientras C es una de las franjas más angostas. A la derecha, el cartograma por población: cada región se redibuja proporcional a sus habitantes, C pasa a ser la mayor con diferencia y E queda reducida a una franja muy delgada. Una nota indica que en el cartograma el tamaño representa la población y no el territorio.</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Ventura: la misma región, dos representaciones</text>
    <text x="140" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Mapa por superficie</text>
    <rect x="80" y="62" width="120" height="40" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">A</text>
    <rect x="80" y="102" width="120" height="52" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">B</text>
    <rect x="80" y="154" width="120" height="34" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="177" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">C</text>
    <rect x="80" y="188" width="120" height="62" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">D</text>
    <rect x="80" y="250" width="120" height="110" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="311" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">E</text>
    <text x="420" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cartograma por población</text>
    <rect x="360" y="62" width="120" height="34" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="85" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">A</text>
    <rect x="360" y="96" width="120" height="46" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="125" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">B</text>
    <rect x="360" y="142" width="120" height="160" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="228" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">C</text>
    <rect x="360" y="302" width="120" height="42" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="329" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">D</text>
    <rect x="360" y="344" width="120" height="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">E</text>
    <path d="M232 210 L328 210" stroke="#111827" stroke-width="1.8"/>
    <path d="M328 210 L318 205 M328 210 L318 215" stroke="#111827" stroke-width="1.8"/>
    <text x="280" y="382" text-anchor="middle" font-size="12" fill="#4b5563">En el cartograma el tamaño representa la población, no el territorio.</text>
    <text x="280" y="398" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
