<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img">
  <title>Dos representaciones del mismo país ficticio de Cardal. A la izquierda, el mapa por superficie: las regiones I, II, III y IV se dibujan según el territorio, y IV es la más extensa mientras III es la más angosta. A la derecha, el cartograma por producción agrícola: III pasa a ser con diferencia la mayor. Una nota indica que en el cartograma el tamaño representa la producción agrícola y no el territorio.</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Cardal: la misma región, dos representaciones</text>
    <text x="140" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Mapa por superficie</text>
    <rect x="80" y="62" width="120" height="50" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="93" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">I</text>
    <rect x="80" y="112" width="120" height="89" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="162" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">II</text>
    <rect x="80" y="201" width="120" height="45" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="229" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">III</text>
    <rect x="80" y="246" width="120" height="114" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="309" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">IV</text>
    <text x="420" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cartograma por producción agrícola</text>
    <rect x="360" y="62" width="120" height="40" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">I</text>
    <rect x="360" y="102" width="120" height="30" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="123" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">II</text>
    <rect x="360" y="132" width="120" height="189" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">III</text>
    <rect x="360" y="321" width="120" height="40" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="347" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">IV</text>
    <path d="M232 210 L328 210" stroke="#111827" stroke-width="1.8"/>
    <path d="M328 210 L318 205 M328 210 L318 215" stroke="#111827" stroke-width="1.8"/>
    <text x="280" y="382" text-anchor="middle" font-size="12" fill="#4b5563">En el cartograma el tamaño representa la producción agrícola, no el territorio.</text>
    <text x="280" y="398" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
