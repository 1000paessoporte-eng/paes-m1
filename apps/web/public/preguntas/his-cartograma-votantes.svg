<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img">
  <title>Dos representaciones del mismo país ficticio de Bermeja. A la izquierda, el mapa por superficie: las regiones P, Q, R y S se dibujan según el territorio, y S es la más extensa mientras Q es la más pequeña. A la derecha, el cartograma por votantes: Q pasa a ser con diferencia la mayor y S queda reducida a una franja delgada. Una nota indica que en el cartograma el tamaño representa los votantes y no el territorio.</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Bermeja: la misma región, dos representaciones</text>
    <text x="140" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Mapa por superficie</text>
    <rect x="80" y="62" width="120" height="70" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="103" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">P</text>
    <rect x="80" y="132" width="120" height="40" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Q</text>
    <rect x="80" y="172" width="120" height="60" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="208" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">R</text>
    <rect x="80" y="232" width="120" height="129" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="140" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">S</text>
    <text x="420" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Cartograma por votantes</text>
    <rect x="360" y="62" width="120" height="60" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">P</text>
    <rect x="360" y="122" width="120" height="149" fill="#9ca3af" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Q</text>
    <rect x="360" y="271" width="120" height="70" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">R</text>
    <rect x="360" y="341" width="120" height="20" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="420" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">S</text>
    <path d="M232 210 L328 210" stroke="#111827" stroke-width="1.8"/>
    <path d="M328 210 L318 205 M328 210 L318 215" stroke="#111827" stroke-width="1.8"/>
    <text x="280" y="382" text-anchor="middle" font-size="12" fill="#4b5563">En el cartograma el tamaño representa la votantes, no el territorio.</text>
    <text x="280" y="398" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
