<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" width="600" height="292" role="img">
  <title>Dos gráficos de la misma variable con distinto tramo de años. La fuente 1 cubre de 1960 a 2020 y muestra un aumento de 20 a 80. La fuente 2 cubre solo de 2010 a 2020 y muestra un aumento de 72 a 80, que en su escala se ve casi plano</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <g transform="translate(20,40)">
    <text x="135" y="-12" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">FUENTE 1: 1960 a 2020</text>
    <line x1="46" y1="150" x2="250" y2="150" stroke="#111827" stroke-width="1.8"/>
    <line x1="46" y1="150" x2="46" y2="10" stroke="#111827" stroke-width="1.8"/>
    <path d="M46 124 L112.667 104.5 L179.333 72 L246 46" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="46" y="170" text-anchor="middle" font-size="11" fill="#4b5563">1960</text>
    <text x="112.667" y="170" text-anchor="middle" font-size="11" fill="#4b5563">1980</text>
    <text x="179.333" y="170" text-anchor="middle" font-size="11" fill="#4b5563">2000</text>
    <text x="246" y="170" text-anchor="middle" font-size="11" fill="#4b5563">2020</text>
    <text x="38" y="25" text-anchor="end" font-size="11" fill="#4b5563">100</text>
    <text x="38" y="155" text-anchor="end" font-size="11" fill="#4b5563">0</text>
    </g>
    <g transform="translate(310,40)">
    <text x="135" y="-12" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">FUENTE 2: 2010 a 2020</text>
    <line x1="46" y1="150" x2="250" y2="150" stroke="#111827" stroke-width="1.8"/>
    <line x1="46" y1="150" x2="46" y2="10" stroke="#111827" stroke-width="1.8"/>
    <path d="M46 56.4 L146 52.5 L246 46" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="46" y="170" text-anchor="middle" font-size="11" fill="#4b5563">2010</text>
    <text x="146" y="170" text-anchor="middle" font-size="11" fill="#4b5563">2015</text>
    <text x="246" y="170" text-anchor="middle" font-size="11" fill="#4b5563">2020</text>
    <text x="38" y="25" text-anchor="end" font-size="11" fill="#4b5563">100</text>
    <text x="38" y="155" text-anchor="end" font-size="11" fill="#4b5563">0</text>
    </g>
    <text x="300" y="250" text-anchor="middle" font-size="12" fill="#4b5563">Los dos gráficos muestran la misma variable.</text>
    <text x="300" y="272" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
