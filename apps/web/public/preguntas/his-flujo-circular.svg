<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img">
  <title>Esquema del flujo circular de la economía: dos cajas, hogares y empresas, unidas por cuatro flechas. De los hogares a las empresas van el trabajo y el capital, y el gasto en bienes; de las empresas a los hogares, los sueldos y rentas, y los bienes y servicios</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M40 90 L210 90 L210 260 L40 260 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="125" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Hogares</text>
    <path d="M410 90 L580 90 L580 260 L410 260 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="495" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Empresas</text>
    <line x1="210" y1="118" x2="400" y2="118" stroke="#111827" stroke-width="1.8"/>
    <path d="M410 118 L398.728 122.115 L398.728 113.885 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <text x="310" y="110" text-anchor="middle" font-size="13" fill="#111827">trabajo y capital</text>
    <line x1="410" y1="166" x2="220" y2="166" stroke="#111827" stroke-width="1.8"/>
    <path d="M210 166 L221.272 161.885 L221.272 170.115 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <text x="310" y="158" text-anchor="middle" font-size="13" fill="#111827">sueldos y rentas</text>
    <line x1="210" y1="214" x2="400" y2="214" stroke="#111827" stroke-width="1.8"/>
    <path d="M410 214 L398.728 218.115 L398.728 209.885 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <text x="310" y="206" text-anchor="middle" font-size="13" fill="#111827">gasto en bienes</text>
    <line x1="410" y1="258" x2="220" y2="258" stroke="#111827" stroke-width="1.8"/>
    <path d="M210 258 L221.272 253.885 L221.272 262.115 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <text x="310" y="250" text-anchor="middle" font-size="13" fill="#111827">bienes y servicios</text>
  </g>
</svg>
