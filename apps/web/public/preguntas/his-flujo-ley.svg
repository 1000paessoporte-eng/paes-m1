<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="580" height="440" role="img">
  <title>Diagrama de flujo de la tramitación de una ley, con cinco pasos encadenados por flechas: iniciativa por mensaje o moción, cámara de origen que discute y vota, cámara revisora que discute y vota, el Presidente que promulga o veta, y la publicación, con la que la ley entra en vigencia</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M140 40 L440 40 L440 96 L140 96 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="290" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">1. Iniciativa</text>
    <text x="290" y="85" text-anchor="middle" font-size="13" fill="#4b5563">mensaje o moción</text>
    <line x1="290" y1="96" x2="290" y2="106" stroke="#111827" stroke-width="1.8"/>
    <path d="M290 116 L285.885 104.728 L294.115 104.728 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <path d="M140 116 L440 116 L440 172 L140 172 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="290" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">2. Cámara de origen</text>
    <text x="290" y="161" text-anchor="middle" font-size="13" fill="#4b5563">discute y vota</text>
    <line x1="290" y1="172" x2="290" y2="182" stroke="#111827" stroke-width="1.8"/>
    <path d="M290 192 L285.885 180.728 L294.115 180.728 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <path d="M140 192 L440 192 L440 248 L140 248 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="290" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">3. Cámara revisora</text>
    <text x="290" y="237" text-anchor="middle" font-size="13" fill="#4b5563">discute y vota</text>
    <line x1="290" y1="248" x2="290" y2="258" stroke="#111827" stroke-width="1.8"/>
    <path d="M290 268 L285.885 256.728 L294.115 256.728 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <path d="M140 268 L440 268 L440 324 L140 324 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="290" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">4. Presidente</text>
    <text x="290" y="313" text-anchor="middle" font-size="13" fill="#4b5563">promulga o veta</text>
    <line x1="290" y1="324" x2="290" y2="334" stroke="#111827" stroke-width="1.8"/>
    <path d="M290 344 L285.885 332.728 L294.115 332.728 Z" fill="#111827" stroke="#111827" stroke-width="1" stroke-linejoin="round"/>
    <path d="M140 344 L440 344 L440 400 L140 400 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="290" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">5. Publicación</text>
    <text x="290" y="389" text-anchor="middle" font-size="13" fill="#4b5563">la ley entra en vigencia</text>
  </g>
</svg>
