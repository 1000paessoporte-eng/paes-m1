<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" width="620" height="220" role="img">
  <title>Línea de tiempo de 1900 a 2000 dividida en cuatro tramos iguales de 25 años, rotulados I, II, III y IV. Las marcas son 1900, 1925, 1950, 1975 y 2000</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <line x1="60" y1="150" x2="560" y2="150" stroke="#111827" stroke-width="2.4"/>
    <line x1="60" y1="140" x2="60" y2="160" stroke="#111827" stroke-width="2"/>
    <text x="60" y="184" text-anchor="middle" font-size="13" fill="#4b5563">1900</text>
    <line x1="185" y1="140" x2="185" y2="160" stroke="#111827" stroke-width="2"/>
    <text x="185" y="184" text-anchor="middle" font-size="13" fill="#4b5563">1925</text>
    <line x1="310" y1="140" x2="310" y2="160" stroke="#111827" stroke-width="2"/>
    <text x="310" y="184" text-anchor="middle" font-size="13" fill="#4b5563">1950</text>
    <line x1="435" y1="140" x2="435" y2="160" stroke="#111827" stroke-width="2"/>
    <text x="435" y="184" text-anchor="middle" font-size="13" fill="#4b5563">1975</text>
    <line x1="560" y1="140" x2="560" y2="160" stroke="#111827" stroke-width="2"/>
    <text x="560" y="184" text-anchor="middle" font-size="13" fill="#4b5563">2000</text>
    <text x="122.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">I</text>
    <text x="247.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">II</text>
    <text x="372.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">III</text>
    <text x="497.5" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">IV</text>
  </g>
</svg>
