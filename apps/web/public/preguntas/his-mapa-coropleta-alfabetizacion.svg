<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img">
  <title>Mapa del país ficticio de Bermeja dividido en cuatro regiones en franjas de norte a sur, rotuladas P, Q, R y S, sombreadas según el porcentaje de alfabetización. La leyenda define cuatro tramos: menos de 50%, de 50% a 69%, de 70% a 89%, y 90% o más. P y R comparten el tramo de 50% a 69%; Q tiene el sombreado de 90% o más; y S, el de menos de 50%. Ninguna región está en el tramo de 70% a 89%.</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Bermeja: alfabetización</text>
    <rect x="120" y="40" width="140" height="80" fill="#d1d5db" stroke="#111827" stroke-width="1.6"/>
    <text x="190" y="87" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">P</text>
    <rect x="120" y="120" width="140" height="80" fill="#4b5563" stroke="#111827" stroke-width="1.6"/>
    <text x="190" y="167" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Q</text>
    <rect x="120" y="200" width="140" height="80" fill="#d1d5db" stroke="#111827" stroke-width="1.6"/>
    <text x="190" y="247" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">R</text>
    <rect x="120" y="280" width="140" height="80" fill="#f3f4f6" stroke="#111827" stroke-width="1.6"/>
    <text x="190" y="327" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">S</text>
    <text x="108" y="46" text-anchor="end" font-size="12" fill="#4b5563">norte</text>
    <text x="108" y="358" text-anchor="end" font-size="12" fill="#4b5563">sur</text>
    <text x="320" y="72" font-size="13" font-weight="600" fill="#111827">Alfabetización</text>
    <rect x="320" y="86" width="26" height="20" fill="#f3f4f6" stroke="#111827" stroke-width="1.4"/>
    <text x="356" y="101" font-size="13" fill="#4b5563">menos de 50%</text>
    <rect x="320" y="116" width="26" height="20" fill="#d1d5db" stroke="#111827" stroke-width="1.4"/>
    <text x="356" y="131" font-size="13" fill="#4b5563">50% a 69%</text>
    <rect x="320" y="146" width="26" height="20" fill="#9ca3af" stroke="#111827" stroke-width="1.4"/>
    <text x="356" y="161" font-size="13" fill="#4b5563">70% a 89%</text>
    <rect x="320" y="176" width="26" height="20" fill="#4b5563" stroke="#111827" stroke-width="1.4"/>
    <text x="356" y="191" font-size="13" fill="#4b5563">90% o más</text>
    <text x="320" y="236" font-size="12" fill="#4b5563">El mapa informa una proporción,</text>
    <text x="320" y="254" font-size="12" fill="#4b5563">no cuánta gente vive en cada</text>
    <text x="320" y="272" font-size="12" fill="#4b5563">región.</text>
    <text x="280" y="398" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
