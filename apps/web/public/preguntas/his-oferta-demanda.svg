    <text x="253" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Cantidad</text>
    <text x="20" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#111827" transform="rotate(-90 20 162)">Precio</text>
    <path d="M111.4 53.2 L394.6 243.6" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
