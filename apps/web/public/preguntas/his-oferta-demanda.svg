  <title>Gráfico de precio contra cantidad con dos rectas: la de oferta sube y la de demanda baja. Se cortan en el punto E, del que bajan líneas punteadas hacia p* en el eje de precios y hacia q* en el de cantidades</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
