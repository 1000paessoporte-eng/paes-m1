    <text x="267" y="136.4" text-anchor="start" font-size="15" font-weight="700" fill="#111827">E</text>
    <text x="253" y="320" text-anchor="middle" font-size="13" fill="#4b5563">q*</text>
    <text x="64" y="153.4" text-anchor="end" font-size="13" fill="#4b5563">p*</text>
