<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img">
  <title>Organigrama del Estado de Chile con tres cajas que dependen de una superior: el poder ejecutivo, que gobierna y administra; el legislativo, que hace las leyes; y el judicial, que resuelve conflictos</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M190 40 L410 40 L410 100 L190 100 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="300" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">ESTADO DE CHILE</text>
    <line x1="300" y1="100" x2="300" y2="130" stroke="#111827" stroke-width="1.6"/>
    <line x1="110" y1="130" x2="490" y2="130" stroke="#111827" stroke-width="1.6"/>
    <line x1="110" y1="130" x2="110" y2="160" stroke="#111827" stroke-width="1.6"/>
    <line x1="300" y1="130" x2="300" y2="160" stroke="#111827" stroke-width="1.6"/>
    <line x1="490" y1="130" x2="490" y2="160" stroke="#111827" stroke-width="1.6"/>
    <path d="M30 160 L190 160 L190 260 L30 260 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="110" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Poder</text>
    <text x="110" y="216" text-anchor="middle" font-size="13" fill="#4b5563">Ejecutivo</text>
    <text x="110" y="238" text-anchor="middle" font-size="13" fill="#4b5563">gobierna y administra</text>
    <path d="M220 160 L380 160 L380 260 L220 260 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="300" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Poder</text>
    <text x="300" y="216" text-anchor="middle" font-size="13" fill="#4b5563">Legislativo</text>
    <text x="300" y="238" text-anchor="middle" font-size="13" fill="#4b5563">hace las leyes</text>
    <path d="M410 160 L570 160 L570 260 L410 260 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <text x="490" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Poder</text>
    <text x="490" y="216" text-anchor="middle" font-size="13" fill="#4b5563">Judicial</text>
    <text x="490" y="238" text-anchor="middle" font-size="13" fill="#4b5563">resuelve conflictos</text>
    <text x="300" y="296" text-anchor="middle" font-size="12" fill="#4b5563">Los tres poderes son autónomos entre sí.</text>
  </g>
</svg>
