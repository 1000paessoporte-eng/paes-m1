<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" role="img">
  <title>Dos pirámides de población del mismo país. La de 1960 es ancha en la base y se angosta rápido hacia arriba. La de 2020 tiene la base más angosta y los tramos de adultos y mayores mucho más anchos</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <text x="150" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Año 1960</text>
    <rect x="14" y="180" width="110" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="180" width="107.8" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="194" text-anchor="middle" font-size="11" fill="#4b5563">0-14</text>
    <rect x="38.2" y="158" width="85.8" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="158" width="83.6" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="172" text-anchor="middle" font-size="11" fill="#4b5563">15-29</text>
    <rect x="60.2" y="136" width="63.8" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="136" width="62.7" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="150" text-anchor="middle" font-size="11" fill="#4b5563">30-44</text>
    <rect x="80" y="114" width="44" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="114" width="46.2" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="128" text-anchor="middle" font-size="11" fill="#4b5563">45-59</text>
    <rect x="99.8" y="92" width="24.2" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="92" width="27.5" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="106" text-anchor="middle" font-size="11" fill="#4b5563">60-74</text>
    <rect x="115.2" y="70" width="8.8" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="176" y="70" width="12.1" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="150" y="84" text-anchor="middle" font-size="11" fill="#4b5563">75+</text>
    <text x="80" y="218" text-anchor="middle" font-size="11" fill="#4b5563">hombres</text>
    <text x="220" y="218" text-anchor="middle" font-size="11" fill="#4b5563">mujeres</text>
    <text x="450" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Año 2020</text>
    <rect x="366.8" y="180" width="57.2" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="180" width="55" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="194" text-anchor="middle" font-size="11" fill="#4b5563">0-14</text>
    <rect x="360.2" y="158" width="63.8" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="158" width="62.7" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="172" text-anchor="middle" font-size="11" fill="#4b5563">15-29</text>
    <rect x="351.4" y="136" width="72.6" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="136" width="71.5" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="150" text-anchor="middle" font-size="11" fill="#4b5563">30-44</text>
    <rect x="355.8" y="114" width="68.2" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="114" width="69.3" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="128" text-anchor="middle" font-size="11" fill="#4b5563">45-59</text>
    <rect x="375.6" y="92" width="48.4" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="92" width="52.8" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="106" text-anchor="middle" font-size="11" fill="#4b5563">60-74</text>
    <rect x="397.6" y="70" width="26.4" height="18" fill="#c7cad1" stroke="#111827" stroke-width="1.2"/>
    <rect x="476" y="70" width="33" height="18" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
    <text x="450" y="84" text-anchor="middle" font-size="11" fill="#4b5563">75+</text>
    <text x="380" y="218" text-anchor="middle" font-size="11" fill="#4b5563">hombres</text>
    <text x="520" y="218" text-anchor="middle" font-size="11" fill="#4b5563">mujeres</text>
    <text x="300" y="268" text-anchor="middle" font-size="11" fill="#4b5563">Datos ficticios, con fines de práctica.</text>
  </g>
</svg>
