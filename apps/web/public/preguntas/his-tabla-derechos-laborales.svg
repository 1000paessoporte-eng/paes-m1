<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img">
  <title>Tabla de dos columnas que empareja cada derecho laboral con quién lo resguarda: la jornada máxima con la Dirección del Trabajo, el pago de remuneraciones con los tribunales laborales, la negociación colectiva con el sindicato de la empresa y la seguridad en el trabajo con la mutualidad y la fiscalización</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <rect x="50" y="40" width="600" height="52" fill="#eef0f3" stroke="none"/>
    <text x="220" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Derecho laboral</text>
    <text x="520" y="73" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Quién lo resguarda</text>
    <text x="220" y="125" text-anchor="middle" font-size="13" fill="#111827">Jornada de trabajo con un máximo legal</text>
    <text x="520" y="125" text-anchor="middle" font-size="13" fill="#111827">Dirección del Trabajo</text>
    <text x="220" y="177" text-anchor="middle" font-size="13" fill="#111827">Pago de las remuneraciones pactadas</text>
    <text x="520" y="177" text-anchor="middle" font-size="13" fill="#111827">Tribunales laborales</text>
    <text x="220" y="229" text-anchor="middle" font-size="13" fill="#111827">Negociación colectiva</text>
    <text x="520" y="229" text-anchor="middle" font-size="13" fill="#111827">Sindicato de la empresa</text>
    <text x="220" y="281" text-anchor="middle" font-size="13" fill="#111827">Seguridad en el lugar de trabajo</text>
    <text x="520" y="281" text-anchor="middle" font-size="13" fill="#111827">Mutualidad y fiscalización</text>
    <line x1="50" y1="40" x2="650" y2="40" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="92" x2="650" y2="92" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="144" x2="650" y2="144" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="196" x2="650" y2="196" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="248" x2="650" y2="248" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="300" x2="650" y2="300" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="40" x2="50" y2="300" stroke="#111827" stroke-width="1.4"/>
    <line x1="390" y1="40" x2="390" y2="300" stroke="#111827" stroke-width="1.4"/>
    <line x1="650" y1="40" x2="650" y2="300" stroke="#111827" stroke-width="1.4"/>
  </g>
</svg>
