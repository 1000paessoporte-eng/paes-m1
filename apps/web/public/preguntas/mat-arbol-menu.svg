<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" role="img">
  <title>Árbol que combina dos entradas, E1 y E2, con tres platos de fondo, P1, P2 y P3: de cada entrada salen tres ramas</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <circle cx="160" cy="110" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="160" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">E1</text>
    <line x1="80" y1="200" x2="140" y2="110" stroke="#111827" stroke-width="2"/>
    <line x1="180" y1="110" x2="320" y2="60" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="60" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="66" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P1</text>
    <line x1="180" y1="110" x2="320" y2="120" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="120" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P2</text>
    <line x1="180" y1="110" x2="320" y2="180" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="180" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P3</text>
    <circle cx="160" cy="290" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="160" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">E2</text>
    <line x1="80" y1="200" x2="140" y2="290" stroke="#111827" stroke-width="2"/>
    <line x1="180" y1="290" x2="320" y2="240" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="240" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P1</text>
    <line x1="180" y1="290" x2="320" y2="300" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="300" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P2</text>
    <line x1="180" y1="290" x2="320" y2="360" stroke="#111827" stroke-width="2"/>
    <circle cx="340" cy="360" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <text x="340" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P3</text>
    <circle cx="80" cy="200" r="5" fill="#111827"/>
    <text x="160" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Entrada</text>
    <text x="340" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#4b5563">Plato de fondo</text>
  </g>
</svg>
