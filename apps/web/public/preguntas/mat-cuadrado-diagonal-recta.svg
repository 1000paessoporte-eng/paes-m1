<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 300" width="570" height="300" role="img">
  <title>Cuadrado de lado 1 apoyado en una recta numérica desde el 0. Su diagonal se traslada con un arco de circunferencia hasta cortar la recta en un punto T, ubicado entre el 1 y el 2</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <line x1="60" y1="250" x2="540" y2="250" stroke="#111827" stroke-width="2"/>
    <line x1="110" y1="243" x2="110" y2="257" stroke="#111827" stroke-width="1.6"/>
    <line x1="260" y1="243" x2="260" y2="257" stroke="#111827" stroke-width="1.6"/>
    <line x1="410" y1="243" x2="410" y2="257" stroke="#111827" stroke-width="1.6"/>
    <text x="110" y="278" text-anchor="middle" font-size="13" fill="#4b5563">0</text>
    <text x="260" y="278" text-anchor="middle" font-size="13" fill="#4b5563">1</text>
    <text x="410" y="278" text-anchor="middle" font-size="13" fill="#4b5563">2</text>
    <path d="M110 250 L260 250 L260 100 L110 100 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="110" y1="250" x2="260" y2="100" stroke="#111827" stroke-width="1.8"/>
    <path d="M124 250 L124 236 L110 236" fill="none" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="185" y="88" text-anchor="middle" font-size="15" fill="#111827">1</text>
    <text x="98" y="180" text-anchor="end" font-size="15" fill="#111827">1</text>
    <path d="M260 100 A212.132 212.132 0 0 1 322.132 250" fill="none" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="6 5"/>
    <circle cx="322.132" cy="250" r="5" fill="#111827"/>
    <text x="322.132" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">T</text>
  </g>
</svg>
