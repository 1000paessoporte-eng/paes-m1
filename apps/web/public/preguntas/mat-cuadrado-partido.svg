<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 390" width="470" height="390" role="img">
  <title>Cuadrado de lado a más b dividido en cuatro regiones: un cuadrado de lado a, dos rectángulos de lados a y b, y un cuadrado de lado b</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M110 60 L410 60 L410 360 L110 360 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="310" y1="60" x2="310" y2="360" stroke="#111827" stroke-width="2"/>
    <line x1="110" y1="260" x2="410" y2="260" stroke="#111827" stroke-width="2"/>
    <text x="210" y="168" text-anchor="middle" font-size="17" fill="#111827">a²</text>
    <text x="360" y="168" text-anchor="middle" font-size="17" fill="#111827">a &#183; b</text>
    <text x="210" y="316" text-anchor="middle" font-size="17" fill="#111827">a &#183; b</text>
    <text x="360" y="316" text-anchor="middle" font-size="17" fill="#111827">b²</text>
    <text x="210" y="44" text-anchor="middle" font-size="15" fill="#111827">a</text>
    <text x="360" y="44" text-anchor="middle" font-size="15" fill="#111827">b</text>
    <text x="98" y="168" text-anchor="end" font-size="15" fill="#111827">a</text>
    <text x="98" y="316" text-anchor="end" font-size="15" fill="#111827">b</text>
  </g>
</svg>
