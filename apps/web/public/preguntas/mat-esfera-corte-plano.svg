<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img">
  <title>Una esfera cortada por un plano horizontal que deja a la vista un círculo. El radio de la esfera está acotado en 10 centímetros y la distancia del centro de la esfera al plano de corte, en 8 centímetros</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <circle cx="250" cy="200" r="150" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="100" y1="80" x2="400" y2="80" stroke="#d4d4d8" stroke-width="1.5"/>
    <ellipse cx="250" cy="80" rx="90" ry="16" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="250" y1="200" x2="250" y2="80" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="250" y1="200" x2="372.9" y2="286" stroke="#111827" stroke-width="2"/>
    <circle cx="250" cy="200" r="4" fill="#111827"/>
    <text x="240" y="140" text-anchor="end" font-size="13" fill="#111827">8 cm</text>
    <text x="324" y="266" text-anchor="start" font-size="13" fill="#111827">10 cm</text>
  </g>
</svg>
