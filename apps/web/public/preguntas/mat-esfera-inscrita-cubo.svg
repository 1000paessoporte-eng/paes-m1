<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img">
  <title>Un cubo dibujado en perspectiva con una esfera inscrita en su interior: la esfera toca las seis caras. La arista del cubo está acotada en 10 centímetros</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <polygon points="150,110 350,110 350,310 150,310" fill="none" stroke="#111827" stroke-width="2"/>
    <polygon points="210,50 410,50 410,250 210,250" fill="none" stroke="#d4d4d8" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="210" y2="50" stroke="#d4d4d8" stroke-width="1.5"/>
    <line x1="350" y1="110" x2="410" y2="50" stroke="#d4d4d8" stroke-width="1.5"/>
    <line x1="350" y1="310" x2="410" y2="250" stroke="#d4d4d8" stroke-width="1.5"/>
    <line x1="150" y1="310" x2="210" y2="250" stroke="#d4d4d8" stroke-width="1.5"/>
    <circle cx="280" cy="180" r="100" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="250" y="336" text-anchor="middle" font-size="13" fill="#111827">10 cm</text>
  </g>
</svg>
