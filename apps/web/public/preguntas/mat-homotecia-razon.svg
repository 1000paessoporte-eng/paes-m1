<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340" role="img">
  <title>Un triángulo T y otro triángulo T' del doble de tamaño, con sus vértices alineados con un punto O mediante líneas punteadas; los dos triángulos quedan del mismo lado de O</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M170 250 L250 280 L200 190 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <path d="M250 200 L410 260 L310 80 Z" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
    <line x1="90" y1="300" x2="250" y2="200" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="90" y1="300" x2="410" y2="260" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="90" y1="300" x2="310" y2="80" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="5 4"/>
    <circle cx="90" cy="300" r="5" fill="#111827"/>
    <text x="78" y="306" text-anchor="end" font-size="15" font-weight="700" fill="#111827">O</text>
    <text x="200" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">T</text>
    <text x="300" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">T'</text>
  </g>
</svg>
