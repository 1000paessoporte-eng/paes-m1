<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img">
  <title>Desde el punto O salen dos rayos. Sobre el de abajo están los puntos A y B, en ese orden; sobre el de arriba, los puntos C y D. Los trazos AC y BD son paralelos entre sí. El tramo OA mide 6 centímetros, el tramo AB mide 4 centímetros y el tramo OC mide 9 centímetros</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <line x1="70" y1="320" x2="448.5" y2="76.66" stroke="#111827" stroke-width="2"/>
    <line x1="70" y1="320" x2="369.5" y2="303.4" stroke="#111827" stroke-width="2"/>
    <line x1="249.7" y1="310" x2="297.1" y2="174" stroke="#111827" stroke-width="2"/>
    <line x1="369.5" y1="303.4" x2="448.5" y2="76.66" stroke="#111827" stroke-width="2"/>
    <circle cx="70" cy="320" r="4" fill="#111827"/>
    <circle cx="249.7" cy="310" r="4" fill="#111827"/>
    <circle cx="369.5" cy="303.4" r="4" fill="#111827"/>
    <circle cx="297.1" cy="174" r="4" fill="#111827"/>
    <circle cx="448.5" cy="76.66" r="4" fill="#111827"/>
    <text x="58" y="332" text-anchor="end" font-size="14" font-weight="700" fill="#111827">O</text>
    <text x="249.7" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">A</text>
    <text x="369.5" y="325.4" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">B</text>
    <text x="283.1" y="168" text-anchor="end" font-size="14" font-weight="700" fill="#111827">C</text>
    <text x="442.5" y="64.66" text-anchor="end" font-size="14" font-weight="700" fill="#111827">D</text>
    <text x="159.9" y="303" text-anchor="middle" font-size="13" fill="#111827">6 cm</text>
    <text x="309.6" y="294.7" text-anchor="middle" font-size="13" fill="#111827">4 cm</text>
    <text x="167.6" y="251" text-anchor="end" font-size="13" fill="#111827">9 cm</text>
  </g>
</svg>
