<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="450" height="400" role="img">
  <title>Punto O a la izquierda. Desde O salen tres rayos: sobre ellos está primero el triángulo ABC, pequeño, y más lejos el triángulo A’B’C’, más grande y con la misma forma. El tramo de O al vértice A está acotado en 4 centímetros y el tramo de A a A’ mide otros 4 centímetros</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <line x1="60" y1="200" x2="390" y2="200" stroke="#d4d4d8" stroke-width="1"/>
    <line x1="60" y1="200" x2="370" y2="200" stroke="#d4d4d8" stroke-width="1"/>
    <line x1="60" y1="200" x2="260" y2="80" stroke="#d4d4d8" stroke-width="1"/>
    <line x1="60" y1="200" x2="260" y2="320" stroke="#d4d4d8" stroke-width="1"/>
    <polygon points="160,140 160,260 215,200" fill="none" stroke="#111827" stroke-width="2"/>
    <polygon points="260,80 260,320 370,200" fill="none" stroke="#111827" stroke-width="2"/>
    <circle cx="60" cy="200" r="4" fill="#111827"/>
    <circle cx="160" cy="140" r="4" fill="#111827"/>
    <circle cx="160" cy="260" r="4" fill="#111827"/>
    <circle cx="215" cy="200" r="4" fill="#111827"/>
    <circle cx="260" cy="80" r="4" fill="#111827"/>
    <circle cx="260" cy="320" r="4" fill="#111827"/>
    <circle cx="370" cy="200" r="4" fill="#111827"/>
    <text x="48" y="205" text-anchor="end" font-size="14" font-weight="700" fill="#111827">O</text>
    <text x="150" y="136" text-anchor="end" font-size="14" font-weight="700" fill="#111827">A</text>
    <text x="150" y="272" text-anchor="end" font-size="14" font-weight="700" fill="#111827">B</text>
    <text x="224" y="196" text-anchor="start" font-size="14" font-weight="700" fill="#111827">C</text>
    <text x="252" y="74" text-anchor="end" font-size="14" font-weight="700" fill="#111827">A’</text>
    <text x="252" y="334" text-anchor="end" font-size="14" font-weight="700" fill="#111827">B’</text>
    <text x="380" y="196" text-anchor="start" font-size="14" font-weight="700" fill="#111827">C’</text>
    <text x="108" y="158" text-anchor="middle" font-size="13" fill="#111827">4 cm</text>
    <text x="212" y="108" text-anchor="middle" font-size="13" fill="#111827">4 cm</text>
  </g>
</svg>
