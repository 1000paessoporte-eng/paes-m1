<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img">
  <title>Mapa con dos localidades unidas por una línea punteada de 5 cm y una barra de escala en la que 2 cm equivalen a 20 km</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <path d="M40 30 L480 30 L480 300 L40 300 Z" fill="none" stroke="#111827" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M80 240 L150 130 L230 190 L300 90 L400 130" fill="none" stroke="#4b5563" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="150" cy="130" r="6" fill="#111827"/>
    <text x="150" y="116" text-anchor="middle" font-size="13" fill="#111827">Villa Alegre</text>
    <circle cx="400" cy="130" r="6" fill="#111827"/>
    <text x="400" y="116" text-anchor="middle" font-size="13" fill="#111827">San Pedro</text>
    <line x1="150" y1="130" x2="400" y2="130" stroke="#111827" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="275" y="158" text-anchor="middle" font-size="13" fill="#111827">5 cm en el mapa</text>
    <line x1="70" y1="262" x2="170" y2="262" stroke="#111827" stroke-width="2.4"/>
    <line x1="70" y1="256" x2="70" y2="268" stroke="#111827" stroke-width="1.8"/>
    <line x1="170" y1="256" x2="170" y2="268" stroke="#111827" stroke-width="1.8"/>
    <text x="120" y="286" text-anchor="middle" font-size="13" fill="#111827">20 km</text>
  </g>
</svg>
