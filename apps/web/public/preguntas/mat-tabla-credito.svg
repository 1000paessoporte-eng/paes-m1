<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 262" width="580" height="262" role="img">
  <title>Tabla con las condiciones de un crédito: monto 1.200.000 pesos, 18 cuotas de 84.000 pesos cada una, y el total pagado marcado con un signo de interrogación</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <rect x="60" y="40" width="260" height="48" fill="#eef0f3" stroke="none"/>
    <text x="76" y="71" text-anchor="start" font-size="15" font-weight="600" fill="#111827">Monto del crédito</text>
    <text x="420" y="71" text-anchor="middle" font-size="15" fill="#111827">$ 1.200.000</text>
    <rect x="60" y="88" width="260" height="48" fill="#eef0f3" stroke="none"/>
    <text x="76" y="119" text-anchor="start" font-size="15" font-weight="600" fill="#111827">Número de cuotas</text>
    <text x="420" y="119" text-anchor="middle" font-size="15" fill="#111827">18</text>
    <rect x="60" y="136" width="260" height="48" fill="#eef0f3" stroke="none"/>
    <text x="76" y="167" text-anchor="start" font-size="15" font-weight="600" fill="#111827">Valor de cada cuota</text>
    <text x="420" y="167" text-anchor="middle" font-size="15" fill="#111827">$ 84.000</text>
    <rect x="60" y="184" width="260" height="48" fill="#eef0f3" stroke="none"/>
    <text x="76" y="215" text-anchor="start" font-size="15" font-weight="600" fill="#111827">Total pagado</text>
    <text x="420" y="215" text-anchor="middle" font-size="15" fill="#111827">?</text>
    <line x1="60" y1="40" x2="520" y2="40" stroke="#111827" stroke-width="1.4"/>
    <line x1="60" y1="88" x2="520" y2="88" stroke="#111827" stroke-width="1.4"/>
    <line x1="60" y1="136" x2="520" y2="136" stroke="#111827" stroke-width="1.4"/>
    <line x1="60" y1="184" x2="520" y2="184" stroke="#111827" stroke-width="1.4"/>
    <line x1="60" y1="232" x2="520" y2="232" stroke="#111827" stroke-width="1.4"/>
    <line x1="60" y1="40" x2="60" y2="232" stroke="#111827" stroke-width="1.4"/>
    <line x1="320" y1="40" x2="320" y2="232" stroke="#111827" stroke-width="1.4"/>
    <line x1="520" y1="40" x2="520" y2="232" stroke="#111827" stroke-width="1.4"/>
  </g>
</svg>
