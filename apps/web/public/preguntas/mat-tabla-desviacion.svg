<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" role="img">
  <title>Tabla con el promedio y la desviación estándar de tres cursos: A tiene promedio 6,0 y desviación 0,3; B tiene promedio 6,0 y desviación 1,4; C tiene promedio 5,2 y desviación 0,4</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <rect x="70" y="40" width="500" height="46" fill="#eef0f3" stroke="none"/>
    <text x="135" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Curso</text>
    <text x="285" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Promedio</text>
    <text x="470" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Desviación estándar</text>
    <text x="135" y="116" text-anchor="middle" font-size="15" fill="#111827">A</text>
    <text x="285" y="116" text-anchor="middle" font-size="15" fill="#111827">6,0</text>
    <text x="470" y="116" text-anchor="middle" font-size="15" fill="#111827">0,3</text>
    <text x="135" y="162" text-anchor="middle" font-size="15" fill="#111827">B</text>
    <text x="285" y="162" text-anchor="middle" font-size="15" fill="#111827">6,0</text>
    <text x="470" y="162" text-anchor="middle" font-size="15" fill="#111827">1,4</text>
    <text x="135" y="208" text-anchor="middle" font-size="15" fill="#111827">C</text>
    <text x="285" y="208" text-anchor="middle" font-size="15" fill="#111827">5,2</text>
    <text x="470" y="208" text-anchor="middle" font-size="15" fill="#111827">0,4</text>
    <line x1="70" y1="40" x2="570" y2="40" stroke="#111827" stroke-width="1.4"/>
    <line x1="70" y1="86" x2="570" y2="86" stroke="#111827" stroke-width="1.4"/>
    <line x1="70" y1="132" x2="570" y2="132" stroke="#111827" stroke-width="1.4"/>
    <line x1="70" y1="178" x2="570" y2="178" stroke="#111827" stroke-width="1.4"/>
    <line x1="70" y1="224" x2="570" y2="224" stroke="#111827" stroke-width="1.4"/>
    <line x1="70" y1="40" x2="70" y2="224" stroke="#111827" stroke-width="1.4"/>
    <line x1="200" y1="40" x2="200" y2="224" stroke="#111827" stroke-width="1.4"/>
    <line x1="370" y1="40" x2="370" y2="224" stroke="#111827" stroke-width="1.4"/>
    <line x1="570" y1="40" x2="570" y2="224" stroke="#111827" stroke-width="1.4"/>
