    <text x="140" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Puntaje</text>
    <text x="290" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Frecuencia</text>
    <text x="450" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Frecuencia acumulada</text>
    <text x="140" y="106" text-anchor="middle" font-size="14" fill="#111827">[0, 20)</text>
