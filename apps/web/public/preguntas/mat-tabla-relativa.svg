<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284" width="600" height="284" role="img">
  <title>Tabla con el deporte preferido de un grupo: fútbol 12 con frecuencia relativa 0,30; básquetbol 8 con 0,20; vóleibol 14 con 0,35; otros 6 con 0,15</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <rect x="50" y="34" width="500" height="44" fill="#eef0f3" stroke="none"/>
    <text x="140" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Deporte</text>
    <text x="295" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Frecuencia</text>
    <text x="455" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Frecuencia relativa</text>
    <text x="140" y="106" text-anchor="middle" font-size="14" fill="#111827">Fútbol</text>
    <text x="295" y="106" text-anchor="middle" font-size="14" fill="#111827">12</text>
    <text x="455" y="106" text-anchor="middle" font-size="14" fill="#111827">0,30</text>
    <text x="140" y="150" text-anchor="middle" font-size="14" fill="#111827">Básquetbol</text>
    <text x="295" y="150" text-anchor="middle" font-size="14" fill="#111827">8</text>
    <text x="455" y="150" text-anchor="middle" font-size="14" fill="#111827">0,20</text>
    <text x="140" y="194" text-anchor="middle" font-size="14" fill="#111827">Vóleibol</text>
    <text x="295" y="194" text-anchor="middle" font-size="14" fill="#111827">14</text>
    <text x="455" y="194" text-anchor="middle" font-size="14" fill="#111827">0,35</text>
    <text x="140" y="238" text-anchor="middle" font-size="14" fill="#111827">Otros</text>
    <text x="295" y="238" text-anchor="middle" font-size="14" fill="#111827">6</text>
    <text x="455" y="238" text-anchor="middle" font-size="14" fill="#111827">0,15</text>
    <line x1="50" y1="34" x2="550" y2="34" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="78" x2="550" y2="78" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="122" x2="550" y2="122" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="166" x2="550" y2="166" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="210" x2="550" y2="210" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="254" x2="550" y2="254" stroke="#111827" stroke-width="1.4"/>
    <line x1="50" y1="34" x2="50" y2="254" stroke="#111827" stroke-width="1.4"/>
    <line x1="230" y1="34" x2="230" y2="254" stroke="#111827" stroke-width="1.4"/>
    <line x1="360" y1="34" x2="360" y2="254" stroke="#111827" stroke-width="1.4"/>
    <line x1="550" y1="34" x2="550" y2="254" stroke="#111827" stroke-width="1.4"/>
