<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img">
  <title>Circunferencia de centro O. Desde el punto exterior P sale una recta tangente que toca la circunferencia en el punto T. El radio OT mide 5 centímetros y llega perpendicular a la tangente. La distancia de O a P, dibujada con línea punteada, mide 13 centímetros</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <circle cx="200" cy="210" r="100" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="200" y1="210" x2="460" y2="210" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="200" y1="210" x2="238.5" y2="117.7" stroke="#111827" stroke-width="2"/>
    <line x1="238.5" y1="117.7" x2="460" y2="210" stroke="#111827" stroke-width="2"/>
    <polygon points="238.5,117.7 233.1,130.6 246,136 251.4,123.1" fill="none" stroke="#111827" stroke-width="1.5"/>
    <circle cx="200" cy="210" r="4" fill="#111827"/>
    <circle cx="460" cy="210" r="4" fill="#111827"/>
    <circle cx="238.5" cy="117.7" r="4" fill="#111827"/>
    <text x="190" y="216" text-anchor="end" font-size="14" font-weight="700" fill="#111827">O</text>
    <text x="472" y="216" text-anchor="start" font-size="14" font-weight="700" fill="#111827">P</text>
    <text x="232.5" y="103.7" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">T</text>
    <text x="330" y="232" text-anchor="middle" font-size="13" fill="#111827">13 cm</text>
    <text x="204" y="158" text-anchor="start" font-size="13" fill="#111827">5 cm</text>
  </g>
</svg>
