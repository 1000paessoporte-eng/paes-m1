<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" width="460" height="390" role="img">
  <title>Una torre vertical apoyada en el suelo. Desde su punta baja un cable tensado hasta un punto del suelo que está a 18 metros de la base. El cable forma un ángulo de 40 grados con el suelo</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="none" stroke="none">
    <line x1="90" y1="330" x2="350" y2="330" stroke="#111827" stroke-width="2"/>
    <line x1="350" y1="330" x2="350" y2="112" stroke="#111827" stroke-width="2"/>
    <line x1="90" y1="330" x2="350" y2="112" stroke="#111827" stroke-width="2"/>
    <polygon points="350,330 336,330 336,316 350,316" fill="none" stroke="#111827" stroke-width="1.5"/>
    <path d="M 136 330 A 46 46 0 0 0 125.2 300.4" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="148" y="314" text-anchor="middle" font-size="13" fill="#111827">40°</text>
    <text x="220" y="354" text-anchor="middle" font-size="13" fill="#111827">18 m</text>
    <text x="362" y="220" text-anchor="start" font-size="13" fill="#111827">torre</text>
    <circle cx="90" cy="330" r="4" fill="#111827"/>
    <circle cx="350" cy="330" r="4" fill="#111827"/>
    <circle cx="350" cy="112" r="4" fill="#111827"/>
  </g>
</svg>
