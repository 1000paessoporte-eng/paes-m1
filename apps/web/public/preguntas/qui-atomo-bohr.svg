<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img">
  <title>Modelo de un átomo con once protones y doce neutrones en el núcleo y once electrones repartidos en tres niveles: dos, ocho y uno</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="300" cy="200" r="62" fill="none" stroke="#4b5563" stroke-width="1.6"/>
    <circle cx="300" cy="200" r="112" fill="none" stroke="#4b5563" stroke-width="1.6"/>
    <circle cx="300" cy="200" r="162" fill="none" stroke="#4b5563" stroke-width="1.6"/>
    <circle cx="300" cy="200" r="40" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.6"/>
    <text x="300" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">11 p+</text>
    <text x="300" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">12 n</text>
    <circle cx="300" cy="138" r="8" fill="#1d4ed8"/>
    <circle cx="300" cy="262" r="8" fill="#1d4ed8"/>
    <circle cx="300" cy="88" r="8" fill="#1d4ed8"/>
    <circle cx="379" cy="121" r="8" fill="#1d4ed8"/>
    <circle cx="412" cy="200" r="8" fill="#1d4ed8"/>
    <circle cx="379" cy="279" r="8" fill="#1d4ed8"/>
    <circle cx="300" cy="312" r="8" fill="#1d4ed8"/>
    <circle cx="221" cy="279" r="8" fill="#1d4ed8"/>
    <circle cx="188" cy="200" r="8" fill="#1d4ed8"/>
    <circle cx="221" cy="121" r="8" fill="#1d4ed8"/>
    <circle cx="300" cy="38" r="8" fill="#1d4ed8"/>
    <text x="300" y="400" text-anchor="middle" font-size="14" fill="#4b5563">Los puntos azules son electrones. En el núcleo, p+ son protones y n neutrones.</text>
  </g>
</svg>
