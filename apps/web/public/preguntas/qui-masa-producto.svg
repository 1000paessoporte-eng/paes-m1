<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 384" width="620" height="384" role="img">
  <title>Gráfico de la masa de producto obtenida según el hidrógeno agregado: sube en línea recta y a partir de cierto punto se mantiene constante</title>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="80" y1="240" x2="530" y2="240"/>
      <line x1="80" y1="180" x2="530" y2="180"/>
      <line x1="80" y1="120" x2="530" y2="120"/>
      <line x1="80" y1="60" x2="530" y2="60"/>
    </g>
    <path d="M80 50 L80 300 L530 300" fill="none" stroke="#1f2937" stroke-width="2.4"/>
    <text x="80" y="322" text-anchor="middle" font-size="13" fill="#4b5563">0</text>
    <text x="170" y="322" text-anchor="middle" font-size="13" fill="#4b5563">2</text>
    <text x="260" y="322" text-anchor="middle" font-size="13" fill="#4b5563">4</text>
    <text x="350" y="322" text-anchor="middle" font-size="13" fill="#4b5563">6</text>
    <text x="440" y="322" text-anchor="middle" font-size="13" fill="#4b5563">8</text>
    <text x="530" y="322" text-anchor="middle" font-size="13" fill="#4b5563">10</text>
    <text x="70" y="305" text-anchor="end" font-size="13" fill="#4b5563">0</text>
    <text x="70" y="245" text-anchor="end" font-size="13" fill="#4b5563">20</text>
    <text x="70" y="185" text-anchor="end" font-size="13" fill="#4b5563">40</text>
    <text x="70" y="125" text-anchor="end" font-size="13" fill="#4b5563">60</text>
    <text x="70" y="65" text-anchor="end" font-size="13" fill="#4b5563">80</text>
    <text x="305.0" y="348" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Masa de hidrógeno agregada (g)</text>
    <text x="22" y="175.0" text-anchor="middle" font-size="15" font-weight="600" fill="#111827" transform="rotate(-90 22 175.0)">Masa de amoníaco obtenida (g)</text>
    <path d="M80 300 L350 120 L530 120" fill="none" stroke="#0f766e" stroke-width="3.4" stroke-linejoin="round"/>
    <line x1="350" y1="120" x2="350" y2="300" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="6 5"/>
    <circle cx="350" cy="120" r="7" fill="#fff" stroke="#0f766e" stroke-width="3"/>
    <text x="300" y="366" text-anchor="middle" font-size="14" fill="#4b5563">Siempre la misma cantidad de nitrógeno, cada vez más hidrógeno.</text>
  </g>
</svg>
